name: Unity C# Tests

on: [push]

jobs:
  test-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x  # Используем актуальную версию .NET

      - name: Find solution or project file
        run: ls -la ${{ github.workspace }}  # Показываем файлы в корне проекта

      - name: Restore dependencies
        working-directory: ${{ github.workspace }}/  # Укажи реальную папку проекта
        run: dotnet restore car.sln  # Если нет `.sln`, используй `.csproj`

      - name: Build C# scripts
        working-directory: ${{ github.workspace }}/
        run: dotnet build --no-restore --configuration Release

      - name: Run C# tests
        working-directory: ${{ github.workspace }}/
        run: dotnet test --no-build --verbosity normal
